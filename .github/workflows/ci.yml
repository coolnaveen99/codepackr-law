name: Law CI — Content & Build Validation

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/copilot-instructions.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/copilot-instructions.md'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-law:
    name: Validate Law Application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Law
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript validation
        run: npm run lint

      - name: Canonical legal-content integrity audit
        run: npm run audit:legal-content

      - name: Canonical content delivery check
        run: npm run check:canonical-delivery

      - name: Production readiness gate
        run: npm run check:readiness

      - name: Wait for Vercel deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for attempt in $(seq 1 36); do
            state=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/status" |
              jq -r '[.statuses[] | select(.context == "Vercel")][0].state // "missing"')
            echo "Vercel deployment status: $state (attempt $attempt/36)"
            if [ "$state" = "success" ]; then
              break
            fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              echo "Vercel deployment failed."
              exit 1
            fi
            if [ "$attempt" = "36" ]; then
              echo "Vercel deployment did not become ready within the validation window."
              exit 1
            fi
            sleep 10
          done

      - name: Production integration smoke
        run: npm run check:production-integration

      - name: Unit tests
        run: npm run test:run

      - name: Production build
        run: npm run build
